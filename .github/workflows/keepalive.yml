name: Tow lead keepalive
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: tow-lead-keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check database through tow-lead
        shell: bash
        run: |
          status=$(curl --silent --show-error --max-time 45 \
            --output /tmp/tow-ping.json --write-out '%{http_code}' \
            'https://pqasdmiqnlyyjwmmqeyc.supabase.co/functions/v1/tow-lead?ping=1')
          if [ "$status" != "200" ]; then
            echo "Keepalive failed: HTTP $status"
            exit 1
          fi
          jq -e '.ok == true' /tmp/tow-ping.json
